<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Ya en enero</title>
<style>
@font-face{font-family:'Montserrat';src:url(data:font/woff2;base64,__FONT__) format('woff2');font-weight:100 900;font-style:normal}
:root{--carbon:#1B2013;--olivo:#384210;--piedra:#A39C87;--ocre:#C4882F;--arena:#EDE8DE;--hueso:#FBFAF7}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--hueso)}
body{font-family:'Montserrat',sans-serif;font-weight:500;color:var(--carbon);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.a{position:absolute;white-space:nowrap;line-height:1;will-change:transform,opacity}
.xb{font-weight:800}
.md{font-weight:500}
.vid{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;display:none;transform-origin:540px 960px}
#safe{position:absolute;inset:0;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bgA" style="position:absolute;inset:0;overflow:hidden"><img class="vid" id="vidA"></div>
  <div id="bgEdge" style="position:absolute;inset:0"><div id="bgEdgeIn" style="position:absolute;inset:0;background:var(--olivo)"></div></div>
  <div id="bgB" style="position:absolute;inset:0;overflow:hidden"><img class="vid" id="vidB"></div>
  <div id="cam"></div>
  <div id="safe">
    <div style="position:absolute;left:0;top:0;width:1080px;height:250px;background:rgba(255,0,0,.25)"></div>
    <div style="position:absolute;left:0;bottom:0;width:1080px;height:420px;background:rgba(255,0,0,.25)"></div>
    <div style="position:absolute;right:0;top:0;width:150px;height:1920px;background:rgba(255,0,0,.25)"></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<script>
'use strict';
/* ---------- tiempo y música ---------- */
const BPM=100, BEAT=60/BPM, BAR=4*BEAT, NBARS=21, DUR=NBARS*BAR; // 50.4 s
const bt=(n,b=1)=>(n-1)*BAR+(b-1)*BEAT;           // compás n, tiempo b (1-indexado)
const C={carbon:'#1B2013',olivo:'#384210',piedra:'#A39C87',ocre:'#C4882F',arena:'#EDE8DE',hueso:'#FBFAF7'};
const X0=90, MAXW=800; // columna de contenido (zona segura: x<930, 250<y<1500)

/* ---------- easing como funciones del tiempo ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const expOut=p=>p>=1?1:1-Math.pow(2,-10*p);
const expIn=p=>p<=0?0:Math.pow(2,10*(p-1));
const expInOut=p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;
function spring(dt,f=2.6,z=0.62){
  if(dt<=0) return 0;
  const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+z*w/wd*Math.sin(wd*dt));
}

/* ---------- clips de video (cuadros JPG en frames/) ---------- */
const VID={
  pizza:  {dir:'frames/pizza',  n:180, fps:59.94, speed:1.0,  off:0.25},
  tuppers:{dir:'frames/tuppers',n:62,  fps:30,    speed:0.86, off:0.0},
};

/* ---------- escenas ---------- */
const cam=document.getElementById('cam');
const SCENES=[
  {id:'hook',  a:bt(1),  b:bt(2),  bg:C.carbon, vid:VID.pizza},
  {id:'intro', a:bt(2),  b:bt(4),  bg:C.arena},
  {id:'p1',    a:bt(4),  b:bt(7),  bg:C.hueso},
  {id:'loop1', a:bt(7),  b:bt(8),  bg:C.carbon},
  {id:'p2',    a:bt(8),  b:bt(9),  bg:C.arena},
  {id:'vid2',  a:bt(9),  b:bt(10), bg:C.carbon, vid:VID.tuppers},
  {id:'p2b',   a:bt(10), b:bt(12), bg:C.hueso},
  {id:'loop2', a:bt(12), b:bt(13), bg:C.carbon},
  {id:'p3',    a:bt(13), b:bt(16), bg:C.arena},
  {id:'rec',   a:bt(16), b:bt(18), bg:C.hueso},
  {id:'cta',   a:bt(18), b:DUR+1,  bg:C.arena},
];
SCENES.forEach(s=>{s.root=document.createElement('div');s.root.className='sc';cam.appendChild(s.root);s.tracks=[];s.props=[];});
const S=Object.fromEntries(SCENES.map(s=>[s.id,s]));

function $(parent,css,html,cls='a'){
  const e=document.createElement('div');e.className=cls;
  if(css) e.style.cssText=css; if(html!=null) e.innerHTML=html;
  (parent.root||parent).appendChild(e); return e;
}
const fx=document.getElementById('fx'); let nfx=0;
function track(sc,el,fn){
  const id='mb'+(nfx++);
  fx.insertAdjacentHTML('beforeend',`<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>`);
  sc.tracks.push({el,fn,id,blur:fx.lastElementChild.firstElementChild}); return el;
}
const prop=(sc,fn)=>sc.props.push(fn);
function applyTrack(tr,t){
  const h=1/240, s=tr.fn(t), a=tr.fn(t-h), b=tr.fn(t+h);
  const x=s.x||0, y=s.y||0, k=s.s??1, sx=(s.sx??1)*k, sy=(s.sy??1)*k, o=clamp(s.o??1), r=s.r||0;
  const el=tr.el;
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  el.style.opacity=o.toFixed(3);
  el.style.visibility=o<0.003?'hidden':'visible';
  const vx=((b.x||0)-(a.x||0))/(2*h), vy=((b.y||0)-(a.y||0))/(2*h);
  const K=1/320;
  const bx=Math.min(40,Math.abs(vx)*K/Math.max(.2,Math.abs(sx))), by=Math.min(40,Math.abs(vy)*K/Math.max(.2,Math.abs(sy)));
  if(bx>0.6||by>0.6){tr.blur.setAttribute('stdDeviation',`${bx.toFixed(2)} ${by.toFixed(2)}`);el.style.filter=`url(#${tr.id})`;}
  else el.style.filter='none';
}

/* ---------- movimientos estándar ---------- */
function io(at,out,o={}){
  const d=o.d??90, dx=o.dx??0, f=o.f??2.6, z=o.z??0.62, ex=o.ex??0.22, exY=o.exY??-240, exX=o.exX??0, s0=o.s0;
  return t=>{
    const e=spring(t-at,f,z), xp=expIn(seg(t,out-ex,out));
    const st={x:(1-e)*dx+xp*exX, y:(1-e)*d+xp*exY, o:seg(t,at,at+0.08)*(1-seg(t,out-ex*0.45,out))};
    if(s0!=null) st.s=lerp(s0,1,e);
    return st;
  };
}
const CUT=(c)=>`clip-path:polygon(0 0,calc(100% - ${c}px) 0,100% ${c}px,100% 100%,0 100%)`;
const CUT2=(c)=>`clip-path:polygon(0 0,calc(100% - ${c}px) 0,100% ${c}px,100% 100%,${c}px 100%,0 calc(100% - ${c}px))`;
const T=(sc,css,html,cls='a')=>$(sc,css,html,cls);
// etiqueta de sección "0X/03 NOMBRE"
function pointTag(sc,num,word,at=sc.a,out=sc.b){
  const el=T(sc,`left:${X0}px;top:280px;padding:16px 40px 16px 24px;background:${C.olivo};color:${C.hueso};font-size:36px;letter-spacing:3px;${CUT(22)}`,
    `<span class="xb">${num}<span style="opacity:.55">/03</span></span>&nbsp;&nbsp;<span class="md">${word}</span>`);
  track(sc,el,io(at,out,{dx:-60,d:0}));
}
// bloque de texto con fondo (para leerse sobre video o como chip)
function blk(sc,x,y,fs,html,o={}){
  const e=T(sc,`left:${x}px;top:${y}px;padding:${o.pad||'14px 34px 16px 24px'};background:${o.bg||C.carbon};color:${o.fg||C.hueso};font-size:${fs}px;${o.ls?`letter-spacing:${o.ls}px;`:''}${CUT(o.cut??26)}`,html,'a '+(o.cls||'xb'));
  if(o.fit!==false) e.dataset.fit=o.fit||MAXW;
  return e;
}
// raya que tacha (barra carbón que se extiende sobre un texto)
function strike(sc,x,y,w,at,out,col=C.carbon,h=14){
  const e=T(sc,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${col};transform-origin:0 50%`,'');
  track(sc,e,t=>({...io(at,out,{d:0})(t),sx:expOut(seg(t,at,at+0.35))}));
  return e;
}
const checkSvg=(c,s=56)=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56"><polyline points="8,30 22,44 48,14" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/></svg>`;

/* =====================================================================
   1 · GANCHO sobre video de pizza (compás 1)
   ===================================================================== */
{
  const sc=S.hook, out=sc.b;
  const tag=blk(sc,X0,300,40,'SEGURO TE HA PASADO ESTO:',{bg:C.hueso,fg:C.carbon,ls:2,cut:22,pad:'14px 36px 14px 22px'});
  track(sc,tag,io(bt(1),out,{dx:-60,d:0}));
  const lines=[['“YA EN ENERO',C.hueso],['ME PONGO',C.hueso],['BIEN.”',C.ocre]];
  lines.forEach(([w,col],i)=>{
    const e=blk(sc,X0,420+i*170,128,`<span style="color:${col}">${w}</span>`,{pad:'18px 40px 20px 26px',cut:30});
    track(sc,e,io(bt(1)+BEAT/4+i*BEAT/4,out,{d:140}));
  });
}

/* =====================================================================
   2 · INTRO (compases 2–3): noviembre–diciembre → enero desde cero
   ===================================================================== */
{
  const sc=S.intro, a=sc.a, b2=bt(3), out=sc.b;
  // compás 2
  const h=T(sc,`left:${X0}px;top:380px;font-size:170px;color:${C.olivo};letter-spacing:-4px`,'NOV · DIC','a xb'); h.dataset.fit=MAXW;
  track(sc,h,io(a,b2,{d:140}));
  const s0=T(sc,`left:${X0}px;top:575px;font-size:54px;color:${C.carbon}`,'son semanas de…','a md');
  track(sc,s0,io(a+BEAT/4,b2,{d:60}));
  ['POSADAS','TAMALES','COMER LO QUE HAYA'].forEach((w,i)=>{
    const e=blk(sc,X0,690+i*130,62,w,{bg:C.olivo,fg:C.hueso,cut:24,pad:'16px 40px 16px 24px'});
    track(sc,e,io(a+BEAT/2+i*BEAT/4,b2,{d:0,dx:-200,f:2.8,z:0.7}));
  });
  const s1=T(sc,`left:${X0}px;top:1120px;font-size:52px;color:${C.carbon}`,'Una tras otra.','a md');
  track(sc,s1,io(bt(2,3)+BEAT/2,b2,{d:60}));
  // compás 3
  const e1=T(sc,`left:${X0}px;top:380px;font-size:220px;color:${C.carbon};letter-spacing:-6px`,'ENERO','a xb'); e1.dataset.fit=MAXW;
  track(sc,e1,io(b2,out,{d:140}));
  // barra de progreso que se vacía
  const by=690;
  const trk=T(sc,`left:${X0}px;top:${by}px;width:${MAXW}px;height:70px;border:5px solid ${C.piedra};transform-origin:0 50%`,'');
  track(sc,trk,t=>({...io(b2,out,{d:0})(t),sx:expOut(seg(t,b2,b2+0.35))}));
  const fill=T(sc,`left:${X0}px;top:${by}px;width:${MAXW}px;height:70px;background:${C.olivo};transform-origin:0 50%;${CUT(30)}`,'');
  const drainA=b2+BEAT, drainB=b2+2*BEAT;
  track(sc,fill,t=>({...io(b2,out,{d:0})(t),sx:expOut(seg(t,b2,b2+0.35))*(1-expInOut(seg(t,drainA,drainB)))}));
  const pct=T(sc,`left:${X0}px;top:${by+100}px;font-size:46px;color:${C.carbon};font-variant-numeric:tabular-nums`,'100%','a xb');
  track(sc,pct,io(b2+BEAT/4,out,{d:30}));
  prop(sc,t=>{pct.textContent=Math.round(100*(1-expInOut(seg(t,drainA,drainB))))+'%';});
  const m1=T(sc,`left:${X0}px;top:1000px;font-size:104px;color:${C.carbon}`,'Desde cero.','a xb'); m1.dataset.fit=MAXW;
  track(sc,m1,io(bt(3,3),out,{d:100}));
  const m2=T(sc,`left:${X0}px;top:1125px;font-size:104px;color:${C.ocre}`,'Otra vez.','a xb');
  track(sc,m2,io(bt(3,3)+BEAT/2,out,{d:100}));
}

/* =====================================================================
   3 · 01/03 POR QUÉ PASA (compases 4–6)
   ===================================================================== */
const OPTS=['¿HUEVO?','¿CEREAL?','¿SÁNDWICH?','PEDIR ALGO'];
const optAt=i=>bt(5)+BEAT/2+i*BEAT/2;
{
  const sc=S.p1, a=sc.a, b2=bt(5), b3=bt(6), out=sc.b;
  pointTag(sc,'01','POR QUÉ PASA');
  // compás 4: 9 PM y no hay nada hecho
  const clk=T(sc,`left:${X0}px;top:380px;font-size:250px;color:${C.olivo};letter-spacing:-8px;font-variant-numeric:tabular-nums`,'9:00','a xb');
  track(sc,clk,io(a,b2,{d:140}));
  const pm=T(sc,`left:680px;top:500px;font-size:110px;color:${C.carbon}`,'PM','a xb');
  track(sc,pm,io(a+BEAT/4,b2,{d:90}));
  // tres tuppers vacíos
  const tw=240, tg=40;
  for(let i=0;i<3;i++){
    const x=X0+i*(tw+tg), at=a+BEAT/2+i*BEAT/4;
    const lid=T(sc,`left:${x+20}px;top:720px;width:${tw-40}px;height:18px;background:${C.piedra}`,'');
    const box=T(sc,`left:${x}px;top:750px;width:${tw}px;height:170px;border:6px solid ${C.piedra};${CUT2(26)}`,'');
    const v=T(sc,`left:${x}px;top:812px;width:${tw}px;text-align:center;font-size:36px;color:${C.piedra};letter-spacing:3px`,'VACÍO','a xb');
    [lid,box,v].forEach(e=>track(sc,e,io(at,b2,{d:60,s0:0.6,f:3,z:0.55})));
  }
  const s1=T(sc,`left:${X0}px;top:1060px;font-size:54px;color:${C.carbon};line-height:1.28`,'Llegas cansado<br><span class="xb">y no hay nada hecho.</span>','a md');
  track(sc,s1,io(bt(4,3),b2,{d:60}));
  // compás 5: ¿qué ceno?
  const q=T(sc,`left:${X0}px;top:380px;font-size:160px;color:${C.carbon}`,'¿QUÉ CENO?','a xb'); q.dataset.fit=MAXW;
  track(sc,q,io(b2,b3,{d:140}));
  const optBox=T(sc,`left:${X0}px;top:640px;width:${MAXW}px;height:200px;border:6px solid ${C.carbon};display:flex;align-items:center;padding-left:40px;font-size:96px;color:${C.carbon};${CUT(40)}`,'','a xb');
  track(sc,optBox,t=>{
    let pop=0; OPTS.forEach((_,i)=>{if(t>=optAt(i)) pop=1-spring(t-optAt(i),3.2,0.45);});
    return {...io(b2+BEAT/4,b3,{d:60})(t),s:1+0.05*pop};
  });
  prop(sc,t=>{
    let k=-1; OPTS.forEach((_,i)=>{if(t>=optAt(i)) k=i;});
    const txt=k<0?'…':OPTS[k], last=k===OPTS.length-1;
    if(optBox.dataset.k!==String(k)){optBox.textContent=txt;optBox.dataset.k=String(k);}
    optBox.style.background=last?C.ocre:'transparent';
    optBox.style.borderColor=last?C.ocre:C.carbon;
  });
  const s2=T(sc,`left:${X0}px;top:1000px;font-size:56px;color:${C.carbon};line-height:1.28`,'Decidir cansado<br><span class="xb">= acabas pidiendo algo.</span>','a md');
  s2.dataset.fit=MAXW;
  track(sc,s2,io(bt(5,4),b3,{d:60}));
  // compás 6: no es fuerza de voluntad, es estructura
  const n1=T(sc,`left:${X0}px;top:390px;font-size:70px;color:${C.carbon}`,'No te falta','a md');
  track(sc,n1,io(b3,out,{d:80}));
  const n2=T(sc,`left:${X0}px;top:480px;font-size:112px;color:${C.piedra}`,'FUERZA DE','a xb'); n2.dataset.fit=MAXW;
  const n3=T(sc,`left:${X0}px;top:605px;font-size:112px;color:${C.piedra}`,'VOLUNTAD.','a xb'); n3.dataset.fit=MAXW;
  track(sc,n2,io(b3+BEAT/4,out,{d:120}));
  track(sc,n3,io(b3+BEAT/2,out,{d:120}));
  strike(sc,X0-10,540,700,bt(6,2)+BEAT/2,out);
  strike(sc,X0-10,665,690,bt(6,2)+BEAT/2+0.08,out);
  const f1=T(sc,`left:${X0}px;top:880px;font-size:70px;color:${C.carbon}`,'Te falta','a md');
  track(sc,f1,io(bt(6,3),out,{d:80}));
  const f2=T(sc,`left:${X0}px;top:970px;font-size:140px;color:${C.olivo}`,'ESTRUCTURA.','a xb'); f2.dataset.fit=MAXW;
  track(sc,f2,io(bt(6,3)+BEAT/4,out,{d:120}));
  const ul=T(sc,`left:${X0}px;top:1135px;width:460px;height:16px;background:${C.ocre};transform-origin:0 50%`,'');
  track(sc,ul,t=>({...io(bt(6,4),out,{d:0})(t),sx:expOut(seg(t,bt(6,4),bt(6,4)+0.4))}));
}

/* =====================================================================
   4 · BUCLE 1 (compás 7): no es comer menos → el domingo
   ===================================================================== */
{
  const sc=S.loop1, a=sc.a, out=sc.b;
  const l0=T(sc,`left:${X0}px;top:380px;font-size:60px;color:${C.arena}`,'Lo que más te ayuda','a md'); l0.dataset.fit=MAXW;
  track(sc,l0,io(a,out,{d:70}));
  const l1=T(sc,`left:${X0}px;top:470px;font-size:120px;color:${C.piedra}`,'NO ES','a xb');
  const l2=T(sc,`left:${X0}px;top:600px;font-size:120px;color:${C.piedra}`,'COMER MENOS.','a xb'); l2.dataset.fit=MAXW;
  track(sc,l1,io(a+BEAT/4,out,{d:120}));
  track(sc,l2,io(a+BEAT/2,out,{d:120}));
  const k1=T(sc,`left:${X0}px;top:880px;font-size:60px;color:${C.arena}`,'Es algo que haces el','a md'); k1.dataset.fit=MAXW;
  track(sc,k1,io(bt(7,3),out,{d:70}));
  const k2=T(sc,`left:${X0}px;top:965px;font-size:170px;color:${C.ocre};letter-spacing:-4px`,'DOMINGO.','a xb'); k2.dataset.fit=MAXW;
  track(sc,k2,io(bt(7,3)+BEAT/4,out,{d:140}));
  const k3=T(sc,`left:${X0}px;top:1190px;font-size:46px;color:${C.piedra}`,'Ahorita te digo.','a md');
  track(sc,k3,io(bt(7,4),out,{d:50}));
}

/* =====================================================================
   5 · 02/03 EL DOMINGO (compás 8): una hora
   ===================================================================== */
{
  const sc=S.p2, a=sc.a, out=sc.b;
  pointTag(sc,'02','EL DOMINGO');
  const big=T(sc,`left:${X0}px;top:380px;display:flex;align-items:baseline;gap:30px`,
    `<span class="xb" style="font-size:300px;color:${C.olivo};letter-spacing:-8px">1</span><span class="xb" style="font-size:140px">HORA</span>`);
  big.dataset.fit=MAXW;
  track(sc,big,io(a,out,{d:140}));
  const lab=T(sc,`left:${X0}px;top:720px;font-size:46px;color:${C.carbon}`,'Dejas listo:','a md');
  track(sc,lab,io(a+BEAT/4,out,{d:40}));
  ['PROTEÍNA','ARROZ','VERDURA'].forEach((w,i)=>{
    const bw=[300,220,260][i], x=X0+[0,320,560][i];
    const e=T(sc,`left:${x}px;top:800px;width:${bw}px;height:110px;background:${C.olivo};color:${C.hueso};font-size:40px;display:flex;align-items:center;justify-content:center;${CUT2(20)}`,w,'a xb');
    track(sc,e,io(a+BEAT/2+i*BEAT/4,out,{d:0,s0:0.2,f:3,z:0.55}));
  });
  const s1=T(sc,`left:${X0}px;top:1040px;font-size:56px;color:${C.carbon};line-height:1.28`,'La base de toda<br><span class="xb">tu semana.</span>','a md');
  track(sc,s1,io(bt(8,3),out,{d:60}));
}

/* =====================================================================
   6 · VIDEO tuppers (compás 9)
   ===================================================================== */
{
  const sc=S.vid2, a=sc.a, out=sc.b;
  const tag=blk(sc,X0,300,40,'ASÍ SE VE MI DOMINGO',{bg:C.hueso,fg:C.carbon,ls:2,cut:22,pad:'14px 36px 14px 22px'});

/* ---------- ajuste de texto a la columna (layout, una sola vez) ---------- */
function fitAll(){
  document.querySelectorAll('[data-fit]').forEach(e=>{
    const max=+e.dataset.fit; const root=e.parentElement;
    const rd=root.style.display; root.style.display='block';
    let fs=parseFloat(getComputedStyle(e).fontSize);
    const kids=[...e.querySelectorAll('span')].map(s=>[s,parseFloat(getComputedStyle(s).fontSize)]);
    const w0=e.style.width; e.style.width='max-content';
    let k=1; for(let i=0;i<60&&e.offsetWidth>max+0.5;i++){k*=0.98;e.style.fontSize=(fs*k)+'px';kids.forEach(([s,f])=>s.style.fontSize=(f*k)+'px');}
    e.style.width=w0; root.style.display=rd;
  });
}

/* ---------- fondo con barrido a 45° (los clips viven en las capas de fondo) ---------- */
const bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB'), bgE=document.getElementById('bgEdge'), bgEIn=document.getElementById('bgEdgeIn');
const vidA=document.getElementById('vidA'), vidB=document.getElementById('vidB');
function tri(c){return `polygon(0px 1920px,${c}px 1920px,0px ${1920-c}px)`;}
function vidSrc(s,t){
  const v=s.vid, i=clamp(Math.floor(((t-s.a)*v.speed+v.off)*v.fps),0,v.n-1)+1;
  return `${v.dir}/f_${String(i).padStart(4,'0')}.jpg`;
}
function paint(layer,img,s,t,pend){
  layer.style.background=s.bg;
  if(!s.vid){img.style.display='none';return;}
  img.style.display='block';
  const src=vidSrc(s,t);
  if(img.dataset.src!==src){img.dataset.src=src;img.src=src;pend.push(img.decode().catch(()=>{}));}
  const z=1+0.06*seg(t,s.a,s.b+0.6);
  img.style.transform=`scale(${z.toFixed(4)})`;
}
function background(t,pend){
  let i=0; SCENES.forEach((s,k)=>{if(t>=s.a) i=k;});
  const cur=SCENES[i], prev=SCENES[Math.max(0,i-1)];
  const ease=p=>1-Math.pow(1-p,3), D=0.55, L=1080+1920+80;
  const cAt=x=>(i===0?1:ease(seg(x,cur.a,cur.a+D)))*L, c=cAt(t);
  const v=Math.abs(cAt(t+1/240)-cAt(Math.max(cur.a,t-1/240)))*120/Math.SQRT2;
  if(c<L) paint(bgA,vidA,prev,t,pend); else {vidA.style.display='none';}
  paint(bgB,vidB,cur,t,pend);
  bgB.style.clipPath=tri(c); bgEIn.style.clipPath=tri(Math.min(c+28,3100));
  bgE.style.display=(c>=L)?'none':'block';
  const bl=Math.min(18,v/700); bgE.style.filter=bl>0.6?`blur(${bl.toFixed(1)}px)`:'none';
}

/* ---------- seek: todo el estilo sale de t ---------- */
window.seek=function(t){
  t=clamp(t,0,DUR);
  const pend=[];
  background(t,pend);
  SCENES.forEach(s=>{
    const on=t>=s.a&&t<s.b;
    s.root.style.display=on?'block':'none';
    if(!on) return;
    s.props.forEach(f=>f(t));
    s.tracks.forEach(tr=>applyTrack(tr,t));
  });
  const z=1+0.07*expInOut(seg(t,bt(21),DUR));
  cam.style.transform=`scale(${z.toFixed(4)})`;
  return pend.length?Promise.all(pend).then(()=>true):true;
};
window.showSafe=v=>{document.getElementById('safe').style.display=v?'block':'none';};
window.META={DUR,BPM,BEAT,BAR,NBARS};
window.ready=(async()=>{
  await document.fonts.load('800 100px Montserrat'); await document.fonts.load('500 100px Montserrat'); await document.fonts.ready;
  fitAll(); await window.seek(0); return true;
})();

/* =====================================================================
   BANDA SONORA (OfflineAudioContext) -> WAV base64
   ===================================================================== */
window.renderAudio=async function(){
  const SR=48000, LEN=Math.ceil(DUR*SR);
  const ctx=new OfflineAudioContext(2,LEN,SR);
  let seed=1234567; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296*2-1;};
  const nb=ctx.createBuffer(1,SR*2,SR); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=rnd();
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=0.004; comp.release.value=0.12; comp.knee.value=8;
  const master=ctx.createGain(); master.gain.value=0.8;
  const fade=ctx.createGain(); fade.gain.setValueAtTime(1,0); fade.gain.setValueAtTime(1,DUR-0.5); fade.gain.linearRampToValueAtTime(0,DUR);
  master.connect(comp); comp.connect(fade); fade.connect(ctx.destination);
  const bus=(g,pan=0)=>{const x=ctx.createGain();x.gain.value=g;const p=ctx.createStereoPanner();p.pan.value=pan;x.connect(p);p.connect(master);return x;};
  const drums=bus(0.8), sfx=bus(1);
  const noise=(t,dur,out)=>{const s=ctx.createBufferSource();s.buffer=nb;s.connect(out);s.start(t,(t*7.3)%1,dur);return s;};
  const env=(g,t,peak,att,dec)=>{g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);};

  function kick(t,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(46,t+0.11);
    env(g,t,0.95*v,0.002,0.34);o.connect(g);g.connect(drums);o.start(t);o.stop(t+0.4);
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const gn=ctx.createGain();env(gn,t,0.18*v,0.001,0.012);
    f.connect(gn);gn.connect(drums);noise(t,0.03,f);
  }
  function clap(t,v=1){
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1600;f.Q.value=0.9;const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    [0,0.011,0.022].forEach(d=>{g.gain.setValueAtTime(0.38*v,t+d);g.gain.exponentialRampToValueAtTime(0.06*v,t+d+0.009);});
    g.gain.setValueAtTime(0.3*v,t+0.033);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    f.connect(g);g.connect(drums);noise(t,0.22,f);
  }
  function hat(t,v=1,open=false){
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7500;const g=ctx.createGain();
    env(g,t,0.13*v,0.001,open?0.16:0.035);f.connect(g);g.connect(drums);noise(t,open?0.2:0.06,f);
  }
  function bass(t,hz,v=1){
    const o=ctx.createOscillator(),s=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='sawtooth';s.type='sine';o.frequency.value=hz;s.frequency.value=hz;
    lp.type='lowpass';lp.Q.value=3;lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(180,t+0.2);
    env(g,t,0.2*v,0.006,0.24);o.connect(lp);s.connect(lp);lp.connect(g);g.connect(drums);o.start(t);s.start(t);o.stop(t+0.3);s.stop(t+0.3);
  }
  function whoosh(tEnd,v=1){
    const t0=tEnd-0.34, f=ctx.createBiquadFilter(),g=ctx.createGain(),p=ctx.createStereoPanner();
    f.type='bandpass';f.Q.value=1.4;f.frequency.setValueAtTime(350,t0);f.frequency.exponentialRampToValueAtTime(4200,tEnd);f.frequency.exponentialRampToValueAtTime(900,tEnd+0.22);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.42*v,tEnd-0.01);g.gain.exponentialRampToValueAtTime(0.0001,tEnd+0.24);
    p.pan.setValueAtTime(-0.6,t0);p.pan.linearRampToValueAtTime(0.6,tEnd+0.2);
    f.connect(g);g.connect(p);p.connect(sfx);noise(t0,0.62,f);
  }
  function tick(t,hz=2400,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=hz;
    env(g,t,0.2*v,0.001,0.035);o.connect(g);g.connect(sfx);o.start(t);o.stop(t+0.06);
  }
  function pop(t,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(1150,t);o.frequency.exponentialRampToValueAtTime(260,t+0.07);
    env(g,t,0.7*v,0.002,0.11);o.connect(g);g.connect(sfx);o.start(t);o.stop(t+0.15);
    tick(t,3200,0.6);
  }
  function boom(t,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(38,t+0.5);
    env(g,t,0.8*v,0.003,1.4);o.connect(g);g.connect(sfx);o.start(t);o.stop(t+1.5);
  }
  // groove
  const notes=[82.41,82.41,65.41,73.42];
  for(let n=1;n<=NBARS;n++){
    for(let b=1;b<=4;b++){
      const t=bt(n,b);
      if(n===NBARS){ if(b===1){kick(t);boom(t,0.7);hat(t,0.8,true);} continue; }
      kick(t, n===1&&b===1?1.1:1);
      if(n>=2&&(b===2||b===4)) clap(t, n>=18?0.8:1);
      hat(t+BEAT/2,1,b===4&&n%2===0);
      if(n>=2) hat(t+BEAT/4,0.45), hat(t+3*BEAT/4,0.45);
      if(n>=2) bass(t+BEAT/2,notes[(n-2)%4]);
    }
  }
  // ---------- instrumentos de efectos ----------
  const ir=ctx.createBuffer(2,Math.floor(SR*1.6),SR);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++) d[i]=rnd()*Math.pow(1-i/d.length,3.2);}
  const verb=ctx.createConvolver();verb.buffer=ir;const vret=ctx.createGain();vret.gain.value=0.32;verb.connect(vret);vret.connect(master);
  const out=(node,send=0)=>{node.connect(sfx);if(send>0){const g=ctx.createGain();g.gain.value=send;node.connect(g);g.connect(verb);}};
  const N={E5:659.26,G5:783.99,A5:880,B5:987.77,D6:1174.66,E6:1318.51,G6:1567.98,A6:1760,B4:493.88,E4:329.63};
  const PENTA=[N.E5,N.G5,N.A5,N.B5,N.D6,N.E6,N.G6,N.A6];
  function impact(t,v=1,hz=55){
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(hz*2.4,t);o.frequency.exponentialRampToValueAtTime(hz,t+0.09);
    env(g,t,0.6*v,0.002,0.26);o.connect(g);out(g);o.start(t);o.stop(t+0.32);
    const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=1400;const gn=ctx.createGain();env(gn,t,0.45*v,0.001,0.045);
    f.connect(gn);out(gn,0.15);noise(t,0.07,f);
  }
  function popS(t,hz=N.E5,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(hz*1.7,t);o.frequency.exponentialRampToValueAtTime(hz,t+0.035);
    env(g,t,0.32*v,0.002,0.09);o.connect(g);out(g,0.12);o.start(t);o.stop(t+0.13);
  }
  function blip(t,hz,v=1){
    [[1,0.28,0.22],[4,0.08,0.05]].forEach(([m,a,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=hz*m;
      env(g,t,a*v,0.002,d);o.connect(g);out(g,0.25);o.start(t);o.stop(t+d+0.05);});
  }
  function ding(t,hz=N.E6,v=1){
    [[1,0.22,1.1],[2.76,0.08,0.45],[5.4,0.04,0.2]].forEach(([m,a,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=hz*m;
      env(g,t,a*v,0.002,d);o.connect(g);out(g,0.45);o.start(t);o.stop(t+d+0.05);});
  }
  const chime=(t,notes,v=1,gap=0.06)=>notes.forEach((hz,i)=>ding(t+i*gap,hz,v));
  function swish(t,dur=0.35,v=1,up=true){
    const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.Q.value=2;
    f.frequency.setValueAtTime(up?600:5000,t);f.frequency.exponentialRampToValueAtTime(up?6000:500,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22*v,t+dur*0.35);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    f.connect(g);out(g);noise(t,dur+0.02,f);
  }
  const zip=(t,v=1)=>swish(t,0.09,v,true);
  function click(t,v=1){
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=3500;const g=ctx.createGain();env(g,t,0.35*v,0.0005,0.012);
    f.connect(g);out(g);noise(t,0.02,f);
  }
  function dim(t,v=1,dur=0.25){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(880,t);o.frequency.exponentialRampToValueAtTime(220,t+dur);
    env(g,t,0.14*v,0.005,dur);o.connect(g);out(g,0.2);o.start(t);o.stop(t+dur+0.05);
  }
  function scratch(t,v=1){ // tachón
    const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.Q.value=3;
    f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(900,t+0.2);
    env(g,t,0.3*v,0.003,0.2);f.connect(g);out(g);noise(t,0.25,f);
  }
  function thud(t,v=1){ // capa que cae al bowl
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(90,t+0.08);
    env(g,t,0.45*v,0.002,0.12);o.connect(g);out(g,0.1);o.start(t);o.stop(t+0.16);
  }
  const tagIn=t=>{click(t,0.8);zip(t,0.5);};

  // ---------- transiciones ----------
  SCENES.slice(1).forEach(s=>whoosh(s.a,1));
  [bt(3),bt(5),bt(6),bt(11),bt(14),bt(15),bt(17)].forEach(t=>whoosh(t,0.45)); // cambios internos
  whoosh(bt(19,3)+0.35,0.3); // entrada del cursor

  // 1 · gancho
  tagIn(bt(1));
  [[BEAT/4,1,55],[BEAT/2,0.85,62],[3*BEAT/4,0.95,49]].forEach(([d,v,hz])=>impact(bt(1)+d,v,hz));
  ding(bt(1)+3*BEAT/4+0.02,N.E6,0.8);                         // "BIEN." en ocre
  // 2 · intro
  impact(bt(2),0.9); popS(bt(2)+BEAT/4,N.G5,0.8);
  for(let i=0;i<3;i++){zip(bt(2)+BEAT/2+i*BEAT/4-0.04,0.4);blip(bt(2)+BEAT/2+i*BEAT/4,PENTA[i*2]);}
  popS(bt(2,3)+BEAT/2,N.A5);
  impact(bt(3),0.9); swish(bt(3),0.35,0.6);
  dim(bt(3)+BEAT,1,2*BEAT);                                   // barra que se vacía
  impact(bt(3,3),0.7,62); ding(bt(3,3)+BEAT/2,N.E5,0.7);      // "Otra vez." (ocre)
  // 3 · por qué pasa
  tagIn(bt(4)); impact(bt(4),0.9); popS(bt(4)+BEAT/4,N.B4);
  for(let i=0;i<3;i++) popS(bt(4)+BEAT/2+i*BEAT/4,PENTA[i],0.8);
  popS(bt(4,3),N.G5); click(bt(4,3),0.4);
  impact(bt(5),0.9);
  OPTS.forEach((_,i)=>{ if(i<OPTS.length-1) blip(optAt(i),PENTA[i+2],0.9); else {impact(optAt(i),0.6,70);ding(optAt(i)+0.02,N.E6,0.8);} });
  popS(bt(5,4),N.A5);
  impact(bt(6),0.7,60); impact(bt(6)+BEAT/4,0.8,55); impact(bt(6)+BEAT/2,0.8,49);
  scratch(bt(6,2)+BEAT/2,1); scratch(bt(6,2)+BEAT/2+0.08,0.7);
  popS(bt(6,3),N.G5); impact(bt(6,3)+BEAT/4,1,50);
  swish(bt(6,4),0.4,0.7); ding(bt(6,4)+0.04,N.E6,0.8);        // subrayado ocre
  // 4 · bucle 1
  popS(bt(7),N.E5); impact(bt(7)+BEAT/4,0.8,62); impact(bt(7)+BEAT/2,0.8,55);
  popS(bt(7,3),N.G5); impact(bt(7,3)+BEAT/4,1.1,45); ding(bt(7,3)+BEAT/4+0.03,N.E6,0.9);
  popS(bt(7,4),N.A5,0.7);
  // 5 · domingo
  tagIn(bt(8)); impact(bt(8),1,50); popS(bt(8)+BEAT/4,N.B4);
  for(let i=0;i<3;i++) popS(bt(8)+BEAT/2+i*BEAT/4,PENTA[i+1],0.9);
  popS(bt(8,3),N.G5);
  // 6 · video tuppers
  tagIn(bt(9)+0.1); impact(bt(9,3),0.9); impact(bt(9,3)+BEAT/4,0.9,49); ding(bt(9,3)+BEAT/4+0.02,N.E6,0.8);
  // 7 · entre semana
  tagIn(bt(10)); impact(bt(10),0.9); impact(bt(10)+BEAT/4,0.8,62);
  DAYS.forEach((_,i)=>blip(dayAt(i),PENTA[i],1.1));
  popS(bt(10,3)+BEAT/2,N.A5);
  impact(bt(11),1,50); popS(bt(11)+BEAT/4,N.B4); popS(bt(11)+BEAT/2,N.E5,0.7);
  swish(bt(11)+BEAT/4,0.5,0.6); ding(bt(11)+BEAT+0.02,N.E6,0.8);   // marcador 35 (ocre)
  popS(bt(11,3),N.G5);
  // 8 · bucle 2
  popS(bt(12),N.E5); impact(bt(12)+BEAT/4,0.8,62); impact(bt(12)+BEAT/2,0.9,55); ding(bt(12)+BEAT/2+0.03,N.E6,0.8);
  popS(bt(12,3),N.G5); popS(bt(12,3)+BEAT/4,N.B5,0.8);
  // 9 · modo posada
  tagIn(bt(13)); impact(bt(13),0.9); impact(bt(13)+BEAT/2,0.9,62);
  pop(bt(13)+BEAT/4,0.6); pop(bt(13)+3*BEAT/4,0.6);
  popS(bt(13,3),N.A5);
  impact(bt(14),0.9); impact(bt(14)+BEAT/4,0.8,62); swish(bt(14)+BEAT/4,0.4,0.5);
  for(let i=0;i<2;i++) popS(bt(14)+BEAT/2+i*BEAT/4,PENTA[i+2],0.9);
  ding(bt(14,3)+0.02,N.E6,0.8); popS(bt(14,3)+BEAT/2,N.G5);
  popS(bt(15),N.E5); impact(bt(15)+BEAT/4,0.9); popS(bt(15)+BEAT/2,N.B4,0.7);
  
  popS(bt(15,3)-BEAT/4,N.E4,0.8); thud(bt(15,3)+0.12); thud(bt(15,3)+BEAT/4+0.12);
  popS(bt(15,4),N.A5);
  // 10 · recetario
  popS(bt(16),N.E5); impact(bt(16)+BEAT/4,1,50);
  for(let i=0;i<16;i++) blip(cntAt(i),PENTA[i%8]*(i>=8?2:1)*0.5,0.9);
  impact(cntAt(15),0.7,62); popS(bt(16,4),N.G5);
  for(let i=0;i<3;i++){impact(bt(17)+i*BEAT/2,0.55,60+i*6);blip(bt(17)+i*BEAT/2,PENTA[i*2]);zip(bt(17)+i*BEAT/2-0.05,0.4);}
  popS(bt(17,3),N.G5); popS(bt(17,3)+BEAT/4,N.B5);
  swish(bt(17,4),0.4,0.7); ding(bt(17,4)+0.04,N.E6,0.8);
  // 11 · CTA
  boom(bt(18),0.6); swish(bt(18),0.5,0.9); chime(bt(18)+0.05,[N.E5,N.B5,N.E6],0.8,0.07);
  popS(bt(18,3),N.G5); click(bt(18,3),0.5);
  popS(bt(19),N.E4,1.2); click(bt(19),0.5);
  for(let i=0;i<WORD.length;i++){click(typeAt(i),0.9);tick(typeAt(i),2000+i*120,0.5);}
  popS(bt(19,3),N.A5,0.8);
  click(TAP-0.04,1); pop(TAP,1); chime(TAP+0.06,[N.B5,N.E6],1,0.08);
  popS(bt(20,3),N.A5);
  impact(bt(21),0.8); chime(bt(21)+0.03,[N.E5,N.G5,N.B5,N.E6],0.7,0.05);

  const buf=await ctx.startRendering();
  const L=buf.getChannelData(0),R=buf.getChannelData(1);let pk=0;for(let i=0;i<L.length;i++){pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]));}
  const gain=pk>0?0.891/pk:1, n=L.length, ab=new ArrayBuffer(44+n*4), dv=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);
  dv.setUint32(24,SR,true);dv.setUint32(28,SR*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,'data');dv.setUint32(40,n*4,true);
  for(let i=0;i<n;i++){dv.setInt16(44+i*4,Math.round(clamp(L[i]*gain,-1,1)*32767),true);dv.setInt16(46+i*4,Math.round(clamp(R[i]*gain,-1,1)*32767),true);}
  const u8=new Uint8Array(ab);let bin='';for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(bin);
};
