<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel Jalón al pecho</title>
<style>
@font-face{font-family:'Montserrat';src:url(data:font/woff2;base64,__FONT__) format('woff2');font-weight:100 900;font-style:normal}
:root{--carbon:#1B2013;--olivo:#384210;--piedra:#A39C87;--ocre:#C4882F;--arena:#EDE8DE;--hueso:#FBFAF7}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--hueso)}
body{font-family:'Montserrat',sans-serif;font-weight:500;color:var(--carbon);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
#cam{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:540px 900px}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;display:none}
.a{position:absolute;white-space:nowrap;line-height:1;will-change:transform,opacity}
.xb{font-weight:800}
.md{font-weight:500}
.vid{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;display:none;transform-origin:540px 960px}
svg text{font-family:'Montserrat',sans-serif}
#safe{position:absolute;inset:0;pointer-events:none;display:none}
</style>
</head>
<body>
<div id="stage">
  <div id="bgA" style="position:absolute;inset:0;overflow:hidden"><img class="vid" id="vidA"></div>
  <div id="bgEdge" style="position:absolute;inset:0"><div id="bgEdgeIn" style="position:absolute;inset:0;background:var(--olivo)"></div></div>
  <div id="bgB" style="position:absolute;inset:0;overflow:hidden"><img class="vid" id="vidB"></div>
  <div id="cam"></div>
  <div id="safe">
    <div style="position:absolute;left:0;top:0;width:1080px;height:250px;background:rgba(255,0,0,.25)"></div>
    <div style="position:absolute;left:0;bottom:0;width:1080px;height:420px;background:rgba(255,0,0,.25)"></div>
    <div style="position:absolute;right:0;top:0;width:150px;height:1920px;background:rgba(255,0,0,.25)"></div>
  </div>
</div>
<svg width="0" height="0" style="position:absolute"><defs id="fx"></defs></svg>
<script>
'use strict';
/* ---------- tiempo y música ---------- */
const BPM=100, BEAT=60/BPM, BAR=4*BEAT, NBARS=19, DUR=NBARS*BAR; // 45.6 s
const bt=(n,b=1)=>(n-1)*BAR+(b-1)*BEAT;           // compás n, tiempo b (1-indexado)
const C={carbon:'#1B2013',olivo:'#384210',piedra:'#A39C87',ocre:'#C4882F',arena:'#EDE8DE',hueso:'#FBFAF7',
         olivoClaro:'#9AA65A',sombra:'#3A4230'};
const X0=90, MAXW=800; // columna de contenido (zona segura: x<930, 250<y<1500)
// tu video (cuadros JPG en frames/jalon). Si no existe, el gancho usa la animación.
const VIDINFO=__VIDINFO__;

/* ---------- easing ---------- */
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,p)=>a+(b-a)*p;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const expOut=p=>p>=1?1:1-Math.pow(2,-10*p);
const expIn=p=>p<=0?0:Math.pow(2,10*(p-1));
const expInOut=p=>p<=0?0:p>=1?1:p<.5?Math.pow(2,20*p-10)/2:(2-Math.pow(2,-20*p+10))/2;
const smooth=p=>p*p*(3-2*p);
function spring(dt,f=2.6,z=0.62){
  if(dt<=0) return 0;
  const w=2*Math.PI*f, wd=w*Math.sqrt(1-z*z);
  return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+z*w/wd*Math.sin(wd*dt));
}
// repetición del ejercicio a ritmo: jalón rápido, pausa abajo, regreso controlado (2 tiempos)
function rep(t,t0,per=2*BEAT){
  if(t<t0) return 0;
  const u=((t-t0)%per)/per;
  if(u<0.34) return 1-Math.pow(1-u/0.34,3);
  if(u<0.48) return 1;
  return 1-smooth((u-0.48)/0.52);
}
function mix(a,b,p){
  p=clamp(p); const h=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));
  const x=h(a), y=h(b); return '#'+x.map((v,i)=>Math.round(lerp(v,y[i],p)).toString(16).padStart(2,'0')).join('');
}

/* ---------- escenas ---------- */
const cam=document.getElementById('cam');
const SCENES=[
  {id:'hook',  a:bt(1),  b:bt(5),  bg:C.arena, vid:VIDINFO},
  {id:'p1',    a:bt(5),  b:bt(8),  bg:C.hueso},
  {id:'loop1', a:bt(8),  b:bt(9),  bg:C.carbon},
  {id:'p2',    a:bt(9),  b:bt(12), bg:C.arena},
  {id:'loop2', a:bt(12), b:bt(13), bg:C.carbon},
  {id:'p3',    a:bt(13), b:bt(15), bg:C.hueso},
  {id:'close', a:bt(15), b:bt(17), bg:C.arena},
  {id:'cta',   a:bt(17), b:DUR+1,  bg:C.hueso},
];
SCENES.forEach(s=>{s.root=document.createElement('div');s.root.className='sc';cam.appendChild(s.root);s.tracks=[];s.props=[];});
const S=Object.fromEntries(SCENES.map(s=>[s.id,s]));

function $(parent,css,html,cls='a'){
  const e=document.createElement('div');e.className=cls;
  if(css) e.style.cssText=css; if(html!=null) e.innerHTML=html;
  (parent.root||parent).appendChild(e); return e;
}
const fx=document.getElementById('fx'); let nfx=0;
function track(sc,el,fn){
  const id='mb'+(nfx++);
  fx.insertAdjacentHTML('beforeend',`<filter id="${id}" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>`);
  sc.tracks.push({el,fn,id,blur:fx.lastElementChild.firstElementChild}); return el;
}
const prop=(sc,fn)=>sc.props.push(fn);
function applyTrack(tr,t){
  const h=1/240, s=tr.fn(t), a=tr.fn(t-h), b=tr.fn(t+h);
  const x=s.x||0, y=s.y||0, k=s.s??1, sx=(s.sx??1)*k, sy=(s.sy??1)*k, o=clamp(s.o??1), r=s.r||0;
  const el=tr.el;
  el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r}deg) scale(${sx.toFixed(4)},${sy.toFixed(4)})`;
  el.style.opacity=o.toFixed(3);
  el.style.visibility=o<0.003?'hidden':'visible';
  const vx=((b.x||0)-(a.x||0))/(2*h), vy=((b.y||0)-(a.y||0))/(2*h);
  const K=1/320;
  const bx=Math.min(40,Math.abs(vx)*K/Math.max(.2,Math.abs(sx))), by=Math.min(40,Math.abs(vy)*K/Math.max(.2,Math.abs(sy)));
  if(bx>0.6||by>0.6){tr.blur.setAttribute('stdDeviation',`${bx.toFixed(2)} ${by.toFixed(2)}`);el.style.filter=`url(#${tr.id})`;}
  else el.style.filter='none';
}

/* ---------- movimientos estándar ---------- */
function io(at,out,o={}){
  const d=o.d??90, dx=o.dx??0, f=o.f??2.6, z=o.z??0.62, ex=o.ex??0.22, exY=o.exY??-240, exX=o.exX??0, s0=o.s0;
  return t=>{
    const e=spring(t-at,f,z), xp=expIn(seg(t,out-ex,out));
    const st={x:(1-e)*dx+xp*exX, y:(1-e)*d+xp*exY, o:seg(t,at,at+0.08)*(1-seg(t,out-ex*0.45,out))};
    if(s0!=null) st.s=lerp(s0,1,e);
    return st;
  };
}
// aparece y se queda (sin salida propia)
const fade=(at,out)=>t=>({o:seg(t,at,at+0.25)*(1-seg(t,out-0.12,out))});
const CUT=(c)=>`clip-path:polygon(0 0,calc(100% - ${c}px) 0,100% ${c}px,100% 100%,0 100%)`;
const CUT2=(c)=>`clip-path:polygon(0 0,calc(100% - ${c}px) 0,100% ${c}px,100% 100%,${c}px 100%,0 calc(100% - ${c}px))`;
const T=(sc,css,html,cls='a')=>$(sc,css,html,cls);
function pointTag(sc,num,word,at=sc.a,out=sc.b){
  const el=T(sc,`left:${X0}px;top:280px;padding:16px 40px 16px 24px;background:${C.olivo};color:${C.hueso};font-size:36px;letter-spacing:3px;${CUT(22)}`,
    `<span class="xb">${num}<span style="opacity:.55">/03</span></span>&nbsp;&nbsp;<span class="md">${word}</span>`);
  track(sc,el,io(at,out,{dx:-60,d:0}));
}
function blk(sc,x,y,fs,html,o={}){
  const e=T(sc,`left:${x}px;top:${y}px;padding:${o.pad||'14px 34px 16px 24px'};background:${o.bg||C.carbon};color:${o.fg||C.hueso};font-size:${fs}px;${o.ls?`letter-spacing:${o.ls}px;`:''}${CUT(o.cut??26)}`,html,'a '+(o.cls||'xb'));
  if(o.fit!==false) e.dataset.fit=o.fit||MAXW;
  return e;
}
function strike(sc,x,y,w,at,out,col=C.carbon,h=14){
  const e=T(sc,`left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${col};transform-origin:0 50%`,'');
  track(sc,e,t=>({...io(at,out,{d:0})(t),sx:expOut(seg(t,at,at+0.35))}));
  return e;
}
// chip con cuadrito de color (leyenda de músculo)
function legend(sc,x,y,col,txt,fs=44,o={}){
  return T(sc,`left:${x}px;top:${y}px;padding:14px 34px 14px 20px;background:${o.bg||C.carbon};color:${o.fg||C.hueso};font-size:${fs}px;display:flex;align-items:center;gap:20px;${CUT(22)}`,
    `<span style="display:inline-block;width:${fs*0.75}px;height:${fs*0.75}px;background:${col}"></span><span class="xb">${txt}</span>`);
}
const checkSvg=(c,s=56)=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56"><polyline points="8,30 22,44 48,14" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/></svg>`;
const crossSvg=(c,s=56)=>`<svg width="${s}" height="${s}" viewBox="0 0 56 56"><path d="M10 10 L46 46 M46 10 L10 46" stroke="${c}" stroke-width="10" stroke-linecap="square"/></svg>`;

/* =====================================================================
   FIGURAS (SVG). Coordenadas locales de 1080×1100; el contenedor escala.
   ===================================================================== */
const NS='http://www.w3.org/2000/svg';
function sv(parent,tag,attrs={}){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent.appendChild(e);return e;}
function layer(sc,x,y,s=1,w=1080,h=1100){
  const d=T(sc,`left:${x}px;top:${y}px;width:${w*s}px;height:${h*s}px;transform-origin:50% 50%`,'');
  const g=document.createElementNS(NS,'svg');
  g.setAttribute('width',w*s);g.setAttribute('height',h*s);g.setAttribute('viewBox',`0 0 ${w} ${h}`);
  g.style.cssText='position:absolute;left:0;top:0;overflow:visible';d.appendChild(g);return {d,svg:g};
}
const P=pts=>pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k];
const mir=p=>[1080-p[0],p[1]];
const rad=d=>d*Math.PI/180;
const setL=(e,a,b)=>{e.setAttribute('x1',a[0].toFixed(1));e.setAttribute('y1',a[1].toFixed(1));e.setAttribute('x2',b[0].toFixed(1));e.setAttribute('y2',b[1].toFixed(1));};
function arrowHead(g,col,sz=34){return sv(g,'polygon',{points:`0,0 ${-sz},${-sz*0.62} ${-sz},${sz*0.62}`,fill:col});}
const placeHead=(h,p,ang)=>h.setAttribute('transform',`translate(${p[0].toFixed(1)},${p[1].toFixed(1)}) rotate(${(ang*180/Math.PI).toFixed(1)})`);

/* ----- vista de espalda: jalón al pecho (o dominada colgando) ----- */
const BK={S:[425,470],L1:175,L2:165};
function backAt(p){ // posiciones del lado izquierdo en función del avance del jalón p (0 arriba, 1 abajo)
  const th=rad(lerp(25,150,p)), ph=rad(lerp(25,-4,p));
  const S=BK.S, u=[-Math.sin(th),-Math.cos(th)], E=add(S,u,BK.L1), H=add(E,[-Math.sin(ph),-Math.cos(ph)],BK.L2);
  return {S,u,E,H,th};
}
function backFig(svg,o={}){
  const body=o.body||C.carbon, shade=o.shade||C.sombra;
  const g=sv(svg,'g');
  const cable=o.hang?null:sv(g,'line',{x1:540,y1:40,x2:540,y2:0,stroke:C.piedra,'stroke-width':8});
  const bar=sv(g,'line',{stroke:body,'stroke-width':20});
  const fig=sv(g,'g');
  const extra=sv(fig,'g'); // capa para trazos de trayectoria
  if(o.hang){
    [[[492,900],[478,1130],[486,1320]],[[588,900],[602,1130],[594,1320]]].forEach(L=>{
      sv(fig,'polyline',{points:P(L),fill:'none',stroke:body,'stroke-width':66,'stroke-linecap':'round','stroke-linejoin':'round'});
    });
  } else sv(fig,'rect',{x:360,y:918,width:360,height:46,fill:C.piedra});
  sv(fig,'polygon',{fill:body,points:P([[440,445],[640,445],[690,482],[665,560],[615,832],[465,832],[415,560],[390,482]])});
  sv(fig,'polygon',{fill:body,points:P([[462,828],[618,828],[642,922],[438,922]])});
  const scap=[0,1].map(()=>sv(fig,'polygon',{fill:shade}));
  const trap=sv(fig,'polygon',{fill:shade});
  const lat=[0,1].map(()=>sv(fig,'polygon',{fill:shade}));
  const spine=sv(fig,'line',{x1:540,y1:440,x2:540,y2:820,stroke:shade,'stroke-width':8});
  const teres=[0,1].map(()=>sv(fig,'line',{stroke:shade,'stroke-width':30,'stroke-linecap':'round'}));
  const up=[0,1].map(()=>sv(fig,'line',{stroke:body,'stroke-width':58,'stroke-linecap':'round'}));
  const bic=[0,1].map(()=>sv(fig,'line',{stroke:body,'stroke-width':30,'stroke-linecap':'round'}));
  const fo=[0,1].map(()=>sv(fig,'line',{stroke:body,'stroke-width':46,'stroke-linecap':'round'}));
  const hand=[0,1].map(()=>sv(fig,'circle',{r:27,fill:body}));
  const delt=[0,1].map(()=>sv(fig,'circle',{r:44,fill:body}));
  sv(fig,'rect',{x:512,y:372,width:56,height:80,fill:body});
  sv(fig,'circle',{cx:540,cy:330,r:58,fill:body});
  const api={g,fig,extra,p:0,
    update(p,hl={}){
      api.p=p;
      const L=backAt(p), sx=10*p, sy=14*p;
      const IA=[478+sx,580+sy];
      const scL=[[455+sx,485+sy],[522+sx,492+sy],IA];
      const latL=[add(L.S,L.u,48),[482+sx*.5,548+sy*.6],[536,578],[536,800],[470,838],[418,650],[410,540]];
      const trapP=[[540,432],[448+sx,470+sy],[520+sx,505+sy],[540,690],[560-sx,505+sy],[632-sx,470+sy]];
      const side=(k,f)=>k?f.map?f.map(mir):mir(f):f;
      const pulse=0.78+0.22*p;
      for(let k=0;k<2;k++){
        const M=q=>k?mir(q):q;
        scap[k].setAttribute('points',P(scL.map(M)));
        lat[k].setAttribute('points',P(latL.map(M)));
        lat[k].setAttribute('fill',mix(shade,C.ocre,(hl.lat||0)*pulse));
        setL(teres[k],M(IA),M(add(L.S,L.u,72)));
        teres[k].setAttribute('stroke',mix(shade,C.olivoClaro,hl.teres||0));
        setL(up[k],M(L.S),M(L.E));
        setL(bic[k],M(add(L.S,L.u,62)),M(add(L.S,L.u,150)));
        bic[k].setAttribute('stroke',mix(body,hl.bicCol||C.piedra,hl.bic||0));
        setL(fo[k],M(L.E),M(L.H));
        hand[k].setAttribute('cx',M(L.H)[0]);hand[k].setAttribute('cy',L.H[1]);
        delt[k].setAttribute('cx',M(L.S)[0]);delt[k].setAttribute('cy',L.S[1]);
      }
      trap.setAttribute('points',P(trapP));
      trap.setAttribute('fill',mix(shade,C.arena,hl.trap||0));
      if(o.hang){
        const H0=backAt(0).H[1], dy=H0-L.H[1];
        fig.setAttribute('transform',`translate(0,${dy.toFixed(1)})`);
        extra.setAttribute('transform',`translate(0,${dy.toFixed(1)})`);
        setL(bar,[180,H0],[900,H0]);
      } else {
        setL(bar,[L.H[0]-70,L.H[1]],[1080-L.H[0]+70,L.H[1]]);
        cable.setAttribute('y2',L.H[1].toFixed(1));
      }
    }};
  api.update(0);
  return api;
}

/* ----- vista lateral, sentado en la polea (mira a la derecha) ----- */
const SD={S:[520,580],L1:175,L2:165,POCKET:[452,928]};
function sideAt(p,bad=false){
  // bien: el codo baja y va hacia atrás (a la bolsa). mal: el codo se queda adelante y jalas con la mano
  const a=rad(bad?lerp(8,150,p):lerp(8,195,p)), b=rad(bad?lerp(8,-6,p):lerp(8,44,p));
  const S=[SD.S[0]+(bad?6*p:0),SD.S[1]-(bad?16*p:0)];
  const u=[Math.sin(a),-Math.cos(a)], E=add(S,u,SD.L1), H=add(E,[Math.sin(b),-Math.cos(b)],SD.L2);
  return {S,u,E,H};
}
function sideFig(svg,o={}){
  const body=o.body||C.carbon, shade=o.shade||C.sombra;
  const g=sv(svg,'g');
  const cable=sv(g,'line',{x1:560,y1:120,x2:560,y2:0,stroke:C.piedra,'stroke-width':8});
  const bar=sv(g,'rect',{width:70,height:22,fill:body});
  // máquina: asiento, poste, rodillo de muslos
  sv(g,'rect',{x:350,y:938,width:300,height:42,fill:C.piedra});
  sv(g,'rect',{x:478,y:980,width:44,height:120,fill:C.piedra});
  sv(g,'rect',{x:640,y:818,width:150,height:44,fill:C.piedra});
  const extra=sv(g,'g');
  sv(g,'polyline',{points:P([[500,898],[722,890],[738,1088],[808,1094]]),fill:'none',stroke:body,'stroke-width':66,'stroke-linecap':'round','stroke-linejoin':'round'});
  const torso=sv(g,'polygon',{fill:body});
  const lat=sv(g,'polygon',{fill:shade});
  const head=sv(g,'circle',{r:56,fill:body});
  const neck=sv(g,'line',{stroke:body,'stroke-width':50});
  const up=sv(g,'line',{stroke:body,'stroke-width':58,'stroke-linecap':'round'});
  const bic=sv(g,'line',{stroke:body,'stroke-width':32,'stroke-linecap':'round'});
  const fo=sv(g,'line',{stroke:body,'stroke-width':46,'stroke-linecap':'round'});
  const hand=sv(g,'circle',{r:27,fill:body});
  const api={g,extra,
    update(p,hl={}){
      const bad=!!hl.bad, L=sideAt(p,bad);
      const lean=bad?10*p:0; // al jalar con brazos se va hacia atrás y sube hombros
      const tp=[[455-lean,522+(bad?-14*p:0)],[548,515+(bad?-16*p:0)],[592,600],[578,860],[562,905],[446,905],[432,800],[440-lean*.5,600]];
      torso.setAttribute('points',P(tp));
      const I=add(L.S,L.u,42);
      lat.setAttribute('points',P([I,[552,665],[528,820],[458,884],[438,720],[452-lean*.5,598]]));
      lat.setAttribute('fill',mix(shade,C.ocre,(hl.lat||0)*(0.78+0.22*p)));
      head.setAttribute('cx',(505+(bad?18*p:0)).toFixed(1));head.setAttribute('cy',(452+(bad?-4*p:0)).toFixed(1));
      setL(neck,[510,530],[505+(bad?14*p:0),470]);
      setL(up,L.S,L.E); setL(fo,L.E,L.H);
      setL(bic,add(L.S,L.u,55),add(L.S,L.u,150));
      bic.setAttribute('stroke',mix(body,hl.bicCol||C.ocre,hl.bic||0));
      hand.setAttribute('cx',L.H[0].toFixed(1));hand.setAttribute('cy',L.H[1].toFixed(1));
      bar.setAttribute('x',(L.H[0]-35).toFixed(1));bar.setAttribute('y',(L.H[1]-11).toFixed(1));
      cable.setAttribute('x2',L.H[0].toFixed(1));cable.setAttribute('x1',L.H[0].toFixed(1));cable.setAttribute('y2',L.H[1].toFixed(1));
      return L;
    }};
  api.update(0);
  return api;
}

/* =====================================================================
   1 · GANCHO + INTRO (compases 1–4) sobre tu video, o la animación si no hay
   ===================================================================== */
{
  const sc=S.hook, out=sc.b, b3=bt(3);
  // animación de respaldo: jalando con los brazos (bíceps encendido, espalda apagada)
  if(!VIDINFO){
    const L=layer(sc,175,770,0.64);
    const f=sideFig(L.svg);
    const q=sv(L.svg,'text',{x:330,y:700,'font-size':150,'font-weight':800,fill:C.olivo,'text-anchor':'middle'});q.textContent='?';
    const xr=sv(L.svg,'g');
    track(sc,L.d,t=>({o:seg(t,0,0.2)*(1-seg(t,out-0.1,out)),y:(1-spring(t,2,0.7))*60}));
    prop(sc,t=>{
      const p=rep(t,0.15);
      f.update(p,{bad:true,bic:seg(t,bt(2),bt(2)+0.3),lat:0});
      q.setAttribute('opacity',seg(t,bt(2,3),bt(2,3)+0.15).toFixed(2));
      q.setAttribute('transform',`translate(0,${(-10*Math.sin(t*5)).toFixed(1)})`);
    });

/* ---------- ajuste de texto a la columna ---------- */
function fitAll(){
  document.querySelectorAll('[data-fit]').forEach(e=>{
    const max=+e.dataset.fit; const root=e.parentElement;
    const rd=root.style.display; root.style.display='block';
    let fs=parseFloat(getComputedStyle(e).fontSize);
    const kids=[...e.querySelectorAll('span')].map(s=>[s,parseFloat(getComputedStyle(s).fontSize)]);
    const w0=e.style.width; e.style.width='max-content';
    let k=1; for(let i=0;i<60&&e.offsetWidth>max+0.5;i++){k*=0.98;e.style.fontSize=(fs*k)+'px';kids.forEach(([s,f])=>s.style.fontSize=(f*k)+'px');}
    e.style.width=w0; root.style.display=rd;
  });
}

/* ---------- fondo con barrido a 45° ---------- */
const bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB'), bgE=document.getElementById('bgEdge'), bgEIn=document.getElementById('bgEdgeIn');
const vidA=document.getElementById('vidA'), vidB=document.getElementById('vidB');
function tri(c){return `polygon(0px 1920px,${c}px 1920px,0px ${1920-c}px)`;}
function vidSrc(s,t){
  const v=s.vid, i=clamp(Math.floor((t-s.a)*v.fps),0,v.n-1)+1;
  return `${v.dir}/f_${String(i).padStart(4,'0')}.jpg`;
}
function paint(layer,img,s,t,pend){
  layer.style.background=s.bg;
  if(!s.vid){img.style.display='none';return;}
  img.style.display='block';
  const src=vidSrc(s,t);
  if(img.dataset.src!==src){img.dataset.src=src;img.src=src;pend.push(img.decode().catch(()=>{}));}
  const z=1+0.05*seg(t,s.a,s.b);
  img.style.transform=`scale(${z.toFixed(4)})`;
}
function background(t,pend){
  let i=0; SCENES.forEach((s,k)=>{if(t>=s.a) i=k;});
  const cur=SCENES[i], prev=SCENES[Math.max(0,i-1)];
  const ease=p=>1-Math.pow(1-p,3), D=0.55, L=1080+1920+80;
  const cAt=x=>(i===0?1:ease(seg(x,cur.a,cur.a+D)))*L, c=cAt(t);
  const v=Math.abs(cAt(t+1/240)-cAt(Math.max(cur.a,t-1/240)))*120/Math.SQRT2;
  if(c<L) paint(bgA,vidA,prev,t,pend); else {vidA.style.display='none';}
  paint(bgB,vidB,cur,t,pend);
  bgB.style.clipPath=tri(c); bgEIn.style.clipPath=tri(Math.min(c+28,3100));
  bgE.style.display=(c>=L)?'none':'block';
  const bl=Math.min(18,v/700); bgE.style.filter=bl>0.6?`blur(${bl.toFixed(1)}px)`:'none';
}

/* ---------- seek: todo el estilo sale de t ---------- */
window.seek=function(t){
  t=clamp(t,0,DUR-1e-4);
  const pend=[];
  background(t,pend);
  SCENES.forEach(s=>{
    const on=t>=s.a&&t<s.b;
    s.root.style.display=on?'block':'none';
    if(!on) return;
    s.props.forEach(f=>f(t));
    s.tracks.forEach(tr=>applyTrack(tr,t));
  });
  const z=1+0.07*expInOut(seg(t,bt(19),DUR));
  cam.style.transform=`scale(${z.toFixed(4)})`;
  return pend.length?Promise.all(pend).then(()=>true):true;
};

/* =====================================================================
   BANDA SONORA (OfflineAudioContext) -> WAV base64
   ===================================================================== */
window.renderAudio=async function(){
  const SR=48000, LEN=Math.ceil(DUR*SR);
  const ctx=new OfflineAudioContext(2,LEN,SR);
  let seed=7654321; const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296*2-1;};
  const nb=ctx.createBuffer(1,SR*2,SR); const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=rnd();
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-16; comp.ratio.value=3; comp.attack.value=0.004; comp.release.value=0.12; comp.knee.value=8;
  const master=ctx.createGain(); master.gain.value=0.8;
  const fd=ctx.createGain(); fd.gain.setValueAtTime(1,0); fd.gain.setValueAtTime(1,DUR-0.5); fd.gain.linearRampToValueAtTime(0,DUR);
  master.connect(comp); comp.connect(fd); fd.connect(ctx.destination);
  const bus=(g,pan=0)=>{const x=ctx.createGain();x.gain.value=g;const p=ctx.createStereoPanner();p.pan.value=pan;x.connect(p);p.connect(master);return x;};
  const drums=bus(0.8), sfx=bus(1);
  const noise=(t,dur,out)=>{const s=ctx.createBufferSource();s.buffer=nb;s.connect(out);s.start(t,(t*7.3)%1,dur);return s;};
  const env=(g,t,peak,att,dec)=>{g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);};
  function kick(t,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(46,t+0.11);
    env(g,t,0.95*v,0.002,0.34);o.connect(g);g.connect(drums);o.start(t);o.stop(t+0.4);
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=2500;const gn=ctx.createGain();env(gn,t,0.18*v,0.001,0.012);
    f.connect(gn);gn.connect(drums);noise(t,0.03,f);
  }
  function clap(t,v=1){
    const f=ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=1600;f.Q.value=0.9;const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    [0,0.011,0.022].forEach(d=>{g.gain.setValueAtTime(0.38*v,t+d);g.gain.exponentialRampToValueAtTime(0.06*v,t+d+0.009);});
    g.gain.setValueAtTime(0.3*v,t+0.033);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
    f.connect(g);g.connect(drums);noise(t,0.22,f);
  }
  function hat(t,v=1,open=false){
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=7500;const g=ctx.createGain();
    env(g,t,0.13*v,0.001,open?0.16:0.035);f.connect(g);g.connect(drums);noise(t,open?0.2:0.06,f);
  }
  function bass(t,hz,v=1){
    const o=ctx.createOscillator(),s=ctx.createOscillator(),lp=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type='sawtooth';s.type='sine';o.frequency.value=hz;s.frequency.value=hz;
    lp.type='lowpass';lp.Q.value=3;lp.frequency.setValueAtTime(900,t);lp.frequency.exponentialRampToValueAtTime(180,t+0.2);
    env(g,t,0.2*v,0.006,0.24);o.connect(lp);s.connect(lp);lp.connect(g);g.connect(drums);o.start(t);s.start(t);o.stop(t+0.3);s.stop(t+0.3);
  }
  function whoosh(tEnd,v=1){
    const t0=tEnd-0.34, f=ctx.createBiquadFilter(),g=ctx.createGain(),p=ctx.createStereoPanner();
    f.type='bandpass';f.Q.value=1.4;f.frequency.setValueAtTime(350,t0);f.frequency.exponentialRampToValueAtTime(4200,tEnd);f.frequency.exponentialRampToValueAtTime(900,tEnd+0.22);
    g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.42*v,tEnd-0.01);g.gain.exponentialRampToValueAtTime(0.0001,tEnd+0.24);
    p.pan.setValueAtTime(-0.6,t0);p.pan.linearRampToValueAtTime(0.6,tEnd+0.2);
    f.connect(g);g.connect(p);p.connect(sfx);noise(t0,0.62,f);
  }
  const ir=ctx.createBuffer(2,Math.floor(SR*1.6),SR);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<d.length;i++) d[i]=rnd()*Math.pow(1-i/d.length,3.2);}
  const verb=ctx.createConvolver();verb.buffer=ir;const vret=ctx.createGain();vret.gain.value=0.32;verb.connect(vret);vret.connect(master);
  const out=(node,send=0)=>{node.connect(sfx);if(send>0){const g=ctx.createGain();g.gain.value=send;node.connect(g);g.connect(verb);}};
  const N={E5:659.26,G5:783.99,A5:880,B5:987.77,D6:1174.66,E6:1318.51,G6:1567.98,A6:1760,B4:493.88,E4:329.63};

  function impact(t,v=1,hz=55){
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(hz*2.4,t);o.frequency.exponentialRampToValueAtTime(hz,t+0.09);
    env(g,t,0.6*v,0.002,0.26);o.connect(g);out(g);o.start(t);o.stop(t+0.32);

  }
  const chime=(t,notes,v=1,gap=0.06)=>notes.forEach((hz,i)=>ding(t+i*gap,hz,v));
  function swish(t,dur=0.35,v=1,up=true){
    const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.Q.value=2;
    f.frequency.setValueAtTime(up?600:5000,t);f.frequency.exponentialRampToValueAtTime(up?6000:500,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22*v,t+dur*0.35);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    f.connect(g);out(g);noise(t,dur+0.02,f);
  }
  const zip=(t,v=1)=>swish(t,0.09,v,true);
  function click(t,v=1){
    const f=ctx.createBiquadFilter();f.type='highpass';f.frequency.value=3500;const g=ctx.createGain();env(g,t,0.35*v,0.0005,0.012);

  }

    const f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='bandpass';f.Q.value=3;
    f.frequency.setValueAtTime(2500,t);f.frequency.exponentialRampToValueAtTime(900,t+0.2);
    env(g,t,0.3*v,0.003,0.2);f.connect(g);out(g);noise(t,0.25,f);
  }
  function pop(t,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
    o.frequency.setValueAtTime(1150,t);o.frequency.exponentialRampToValueAtTime(260,t+0.07);
    env(g,t,0.7*v,0.002,0.11);o.connect(g);out(g);o.start(t);o.stop(t+0.15);
  }
  function boom(t,v=1){
    const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(38,t+0.5);

    [[420,0.12,0.12],[1180,0.06,0.07]].forEach(([hz,a,d])=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.value=hz;

  reps(bt(5),bt(8),bt(5)+0.3); reps(bt(9),bt(11),bt(9)+0.6); reps(bt(10),bt(11),bt(10)+BEAT/2); reps(bt(16),bt(17),bt(16)+BEAT/2);
  // gancho

  impact(bt(8,3),1.1,45); ding(bt(8,3)+0.03,N.E6,0.9); popS(bt(8,4),N.A5,0.8);

  popS(bt(15,3)+BEAT/2,N.G5); impact(bt(15,4),0.7,62); scratch(bt(15,4)+BEAT/2,1); scratch(bt(15,4)+BEAT/2+0.08,0.7);

  const L=buf.getChannelData(0),R=buf.getChannelData(1);let pk=0;for(let i=0;i<L.length;i++){pk=Math.max(pk,Math.abs(L[i]),Math.abs(R[i]));}
  const gain=pk>0?0.891/pk:1, n=L.length, ab=new ArrayBuffer(44+n*4), dv=new DataView(ab);

  ws(0,'RIFF');dv.setUint32(4,36+n*4,true);ws(8,'WAVE');ws(12,'fmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);

  for(let i=0;i<n;i++){dv.setInt16(44+i*4,Math.round(clamp(L[i]*gain,-1,1)*32767),true);dv.setInt16(46+i*4,Math.round(clamp(R[i]*gain,-1,1)*32767),true);}
  const u8=new Uint8Array(ab);let bin='';for(let i=0;i<u8.length;i+=0x8000) bin+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
